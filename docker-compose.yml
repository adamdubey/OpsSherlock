name: opssherlock

x-app: &app
  restart: unless-stopped
  init: true
  networks: [app, observability]
  environment: &otel_env
    OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
    DEPLOYMENT_ENVIRONMENT: local
    SERVICE_VERSION: "0.3.0"
  depends_on:
    alloy:
      condition: service_started

services:
  gateway:
    <<: *app
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *otel_env
      SERVICE_NAME: gateway
      CATALOG_URL: http://catalog:8000
      CHECKOUT_URL: http://checkout:8000
      ORDERS_URL: http://orders:8000
    ports: ["8080:8000"]
    depends_on:
      alloy: {condition: service_started}
      catalog: {condition: service_healthy}
      checkout: {condition: service_healthy}
      orders: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  catalog:
    <<: *app
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      <<: *otel_env
      SERVICE_NAME: catalog
      REDIS_URL: redis://redis:6379/0
    ports: ["8002:8000"]
    depends_on:
      alloy: {condition: service_started}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  checkout:
    <<: *app
    build:
      context: .
      dockerfile: services/checkout/Dockerfile
    environment:
      <<: *otel_env
      SERVICE_NAME: checkout
      CATALOG_URL: http://catalog:8000
      PAYMENTS_URL: http://payments:8000
      ORDERS_URL: http://orders:8000
      UPSTREAM_TIMEOUT_SECONDS: "3"
    ports: ["8001:8000"]
    depends_on:
      alloy: {condition: service_started}
      catalog: {condition: service_healthy}
      payments: {condition: service_healthy}
      orders: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  payments:
    <<: *app
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      <<: *otel_env
      SERVICE_NAME: payments
      PAYMENT_DELAY_MS: "60"
    ports: ["8004:8000"]
    depends_on:
      alloy: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  orders:
    <<: *app
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    environment:
      <<: *otel_env
      SERVICE_NAME: orders
      DATABASE_URL: postgresql://baker:baker@postgres:5432/baker
    ports: ["8003:8000"]
    depends_on:
      alloy: {condition: service_started}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: baker
      POSTGRES_USER: baker
      POSTGRES_PASSWORD: baker
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baker -d baker"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    networks: [app]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [observability]
    depends_on:
      gateway: {condition: service_healthy}
      checkout: {condition: service_healthy}

  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: ["3100:3100"]
    networks: [observability]

  tempo:
    image: grafana/tempo:3.0.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]
    networks: [observability]

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    networks: [observability]
    depends_on:
      - loki
      - tempo

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: opssherlock
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [observability]
    depends_on:
      - prometheus
      - loki
      - tempo

  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama-data:/root/.ollama"]
    ports: ["11434:11434"]
    networks: [observability]

  agent:
    build: ./agent
    profiles: ["tools"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_URL: http://ollama:11434
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      CHECKOUT_URL: http://checkout:8000
    volumes:
      - ./artifacts:/app/artifacts
      - ./scenarios:/app/scenarios:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [app, observability]
    depends_on:
      checkout: {condition: service_healthy}
      prometheus: {condition: service_started}
      loki: {condition: service_started}
      tempo: {condition: service_started}
      ollama: {condition: service_started}

networks:
  app: {}
  observability: {}

volumes:
  postgres-data:
  redis-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
  ollama-data:

name: Deploy incident portal

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build OpsSherlock portal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: source

      - name: Checkout evidence archive
        uses: actions/checkout@v4
        with:
          ref: evidence
          path: published-evidence

      - name: Restore published incidents
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source/artifacts/incidents

          if [ ! -d "published-evidence/incidents" ]; then
            echo "::error::The evidence branch does not contain an incidents directory."
            exit 1
          fi

          cp -a published-evidence/incidents/. source/artifacts/incidents/

          echo
          echo "Restored evidence archive:"
          find source/artifacts/incidents -maxdepth 3 -type f | sort

      - name: Verify published evidence exists
        shell: bash
        run: |
          set -euo pipefail

          INCIDENT_COUNT="$(
            find source/artifacts/incidents \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name incident.json \
              | wc -l \
              | tr -d ' '
          )"

          echo "Published incidents: ${INCIDENT_COUNT}"

          if [ "${INCIDENT_COUNT}" -eq 0 ]; then
            echo "::error::No published OpsSherlock incidents were found on the evidence branch."
            exit 1
          fi

      - name: Show published incident IDs
        shell: bash
        run: |
          set -euo pipefail

          echo "Incident archive:"
          find source/artifacts/incidents \
            -mindepth 2 \
            -maxdepth 2 \
            -type f \
            -name incident.json \
            -print \
            | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static incident portal
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          python3 site/build.py

          echo
          echo "Generated site:"
          find site/dist -maxdepth 3 -type f | sort | head -200

      - name: Verify generated portal
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "site/dist/index.html" ]; then
            echo "::error::site/dist/index.html was not generated."
            exit 1
          fi

          if [ ! -f "site/dist/benchmark.json" ]; then
            echo "::error::site/dist/benchmark.json was not generated."
            exit 1
          fi

          echo "benchmark.json:"
          cat site/dist/benchmark.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/site/dist

  deploy:
    name: Deploy OpsSherlock portal
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Build demo services and agent
        run: docker compose build checkout inventory agent
      - name: Compile Python
        run: python -m compileall agent services site
